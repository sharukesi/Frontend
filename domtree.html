<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id ="contentBox" class="info">
        this is a content box
    </div>

    <button id="clickBtn">CLick me</button>
    <p id="clickOutput"></p>
<label for="nameInput">Type your name: </label>
<input type="text" id="nameInput"/>
<p id="inputOutput"></p>

    <script>
        const clickBtn = document.getElementById("clickBtn");
        const clickOutput = document.getElementById("clickOutput");

        clickBtn.addEventListener("click",() => {
            clickOutput.textContent="button was clicked!";
        });
const nameInput = document.getElementById("nameInput");
const inputOutput = document.getElementById("inputOutput");

nameInput.addEventListener("input",function(){
inputOutput.textContent ="hello," + this.value;
});
    </script>

<form id="myForm">
    <label for="email">Enter your email:</label>
    <input type="email" name="email" id="email" required/>
    <button type="submit">Submit</button>
</form>
<script>
const form = document.getElementById("myForm");
const formMessage =  document.getElementById("formMessage");

 form.addEventListener("submit",function(){
    e.preventDefault();

    const email = document.getElementById("email").value;
    formMessage.textContent ="form submitted with email:"+ email;

 });
    


</script>

</body>
</html>
