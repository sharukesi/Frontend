<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    .contact {
        text-align: center;
        padding: 50px;
    }

    .contact form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        max-width: 400px;
        margin: 0 auto;
    }

    .contact input, .contact textarea {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    .contact button {
        background-color: #222;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 4px;
    }

    .contact button:hover {
        background-color: #555;
    }

</style>

<body>

<header>
    <h1>💻 TechZone</h1>

    
</header>

<section class="contact">

    <h1>Contact Us 📩</h1>
    <p>Have a question? Feel free to contact us.</p>

    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Message:</label>
        <textarea placeholder="Enter your message"></textarea>

        <button type="submit">Send Message</button>
    </form>

</section>

<footer>
    <p>© 2026 TechZone</p>
</footer>

</body>
</html>
