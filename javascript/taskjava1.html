<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
   // JavaScript Variable Scope Assignment

// 1. Global Scope
var globalVar = "I am a global var";
let globalLet = "I am a global let";
const globalConst = "I am a global const";

console.log("Global var:", globalVar);
console.log("Global let:", globalLet);
console.log("Global const:", globalConst);


// 2. Function Scope
function showFunctionScope() {
    var functionVar = "I am inside the function";
    let functionLet = "I am also inside the function";
    const functionConst = "I am a constant inside the function";

    console.log("Function var:", functionVar);
    console.log("Function let:", functionLet);
    console.log("Function const:", functionConst);
}

showFunctionScope();

// Trying to access function variables outside the function
console.log(functionVar);   // ReferenceError
console.log(functionLet);   // ReferenceError
console.log(functionConst); // ReferenceError


// 3. Block Scope
{
    var blockVar = "var inside block";
    let blockLet = "let inside block";
    const blockConst = "const inside block";

    console.log("Block var:", blockVar);
    console.log("Block let:", blockLet);
    console.log("Block const:", blockConst);
}

// var can be accessed outside the block
console.log("Outside block - var:", blockVar);

// let and const cannot be accessed outside the block
console.log(blockLet);   // ReferenceError
console.log(blockConst); // ReferenceError
</script>
</body>
</html>
