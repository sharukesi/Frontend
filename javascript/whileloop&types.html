<body>
    //while loop
    <script>
        let correctPassword="12345";
        let userInput=prompt("Enter password:");

        while(userInput!==correctPassword){
            alert("Incorrect password. Please try again.");
            userInput=prompt("Enter password:");
        }
        alert("Password correct. Welcome!");
</script>

//do while loop

<script>

let a=1;
do{
    if(a===5){
        a++;
        continue;
    }

    if(a===8){
        break;
    }
    console.log(a);
    a++;
} 
while(a<=10);


 </script>
