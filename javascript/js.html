<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript Functions and Scope</h1>
    <h2>Function Declarations, Expressions, and Arrow Functions</h2>
    <h3>Callback Functions and Closures</h3>
    <h4>Understanding Variable Scope in JavaScript</h4>
<script>

    
let name = "Sharu";


function add(a, b) {
    return a + b;
}


const multiply = function(a, b) {
    return a * b;
};


const subtract = (a, b) => {
    return a - b;
};


function square(number) {
    return number * number;
}


function calculate(a, b, callback) {
    return callback(a, b);
}

function counterFunction() {
    let count = 0; // Local variable

    return function() {
        count++;
        return count;
    };
}


console.log("Name:", name);

console.log("Addition:", add(10, 5));
console.log("Multiplication:", multiply(10, 5));
console.log("Subtraction:", subtract(10, 5));
console.log("Square:", square(5));


console.log("Callback Addition:", calculate(20, 10, add));


function scopeExample() {
    let localName = "Kesi";

    console.log("Global variable:", name);
    console.log("Local variable:", localName);
}

scopeExample();

const counter = counterFunction();

console.log("Counter:", counter());
console.log("Counter:", counter());
console.log("Counter:", counter());


</script>
</body>
</html>
